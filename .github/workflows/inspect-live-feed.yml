name: Temporary dedicated Live feed inspection
on:
  push:
    branches:
      - work/mobile-live-feed-lau-style-20261012
    paths:
      - .github/workflows/inspect-live-feed.yml
permissions:
  contents: write
jobs:
  inspect-live-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mobile-live-feed-lau-style-20261012
          fetch-depth: 1
      - name: Fetch and summarize dedicated Live M3U
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 45 \
            -H 'Accept: text/plain, application/vnd.apple.mpegurl, */*' \
            -H 'Cache-Control: no-cache' \
            'https://thethaonm7.phuongnm7-iptv.workers.dev/playlist.m3u' -o /tmp/live-feed.m3u
          python3 - <<'PY' > LIVE_FEED_INSPECTION.md
          import re, collections
          from pathlib import Path
          text = Path('/tmp/live-feed.m3u').read_text(encoding='utf-8-sig', errors='replace')
          print('# Temporary Live feed inspection')
          print()
          print('- Bytes:', len(text.encode('utf-8')))
          print('- Header:', next((x.strip()[:250] for x in text.splitlines() if x.strip()), '<empty>'))
          entries=[]
          for line in text.splitlines():
              line=line.strip()
              if line.startswith('#EXTINF:'):
                  m=re.search(r'group-title=["\']([^"\']*)["\']', line, re.I)
                  name=line.split(',',1)[1].strip() if ',' in line else ''
                  logo=bool(re.search(r'(?:tvg-logo|logo|icon)=["\'][^"\']+["\']', line, re.I))
                  entries.append({'group':m.group(1).strip() if m else '(no group)', 'name':name, 'logo':logo, 'meta':line[:450]})
          print('- Entries:', len(entries))
          print()
          print('## Groups')
          print()
          for g,n in collections.Counter(x['group'] for x in entries).most_common(): print('- '+str(n)+' — '+g)
          print()
          print('## Entry titles sample (stream URLs intentionally omitted)')
          print()
          for x in entries[:120]: print('- ['+x['group']+'] '+x['name']+' (logo='+str(x['logo'])+')')
          print()
          print('## EXTINF metadata examples (URL omitted)')
          print()
          for x in entries[:12]:
              m=re.sub(r'https?://[^\s"\']+', '[url]', x['meta'])
              print('- '+m)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LIVE_FEED_INSPECTION.md
          git commit -m 'test: record dedicated Live feed structure' || exit 0
          git push origin HEAD:work/mobile-live-feed-lau-style-20261012
