name: Temporary dedicated Live feed inspection
on:
  push:
    branches:
      - work/mobile-live-feed-lau-style-20261012
    paths:
      - .github/workflows/inspect-live-feed.yml
permissions:
  contents: write
jobs:
  inspect-live-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/mobile-live-feed-lau-style-20261012
          fetch-depth: 1
      - name: Fetch and summarize dedicated Live M3U
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 --max-time 45 \
            -H 'Accept: text/plain, application/vnd.apple.mpegurl, */*' \
            -H 'Cache-Control: no-cache' \
            'https://thethaonm7.phuongnm7-iptv.workers.dev/playlist.m3u' -o /tmp/live-feed.m3u
          python3 - <<'PY' > LIVE_FEED_INSPECTION.md
          import re, collections
          from pathlib import Path
          text = Path('/tmp/live-feed.m3u').read_text(encoding='utf-8-sig', errors='replace')
          entries=[]
          for line in text.splitlines():
              line=line.strip()
              if not line.startswith('#EXTINF:'): continue
              m=re.search(r'group-title=["\']([^"\']*)["\']', line, re.I)
              name=line.split(',',1)[1].strip() if ',' in line else ''
              logo=bool(re.search(r'(?:tvg-logo|logo|icon)=["\'][^"\']+["\']', line, re.I))
              status='green' if '🟢' in name else ('yellow' if '🟡' in name else ('red' if '🔴' in name else 'none'))
              entries.append({'group':m.group(1).strip() if m else '(no group)', 'name':name, 'logo':logo, 'status':status, 'meta':line[:350]})
          print('# Temporary Live feed inspection')
          print()
          print('- Bytes: '+str(len(text.encode('utf-8'))))
          print('- Entries: '+str(len(entries)))
          print('- Status markers: '+str(dict(collections.Counter(x['status'] for x in entries))))
          print()
          print('## Groups')
          print()
          for g,n in collections.Counter(x['group'] for x in entries).most_common(): print('- '+str(n)+' — '+g)
          print()
          print('## Status totals by group')
          print()
          for g in collections.Counter(x['group'] for x in entries).keys():
              cs=collections.Counter(x['status'] for x in entries if x['group']==g)
              print('- '+g+': '+str(dict(cs)))
          print()
          for status in ['green','yellow','red','none']:
              print('## '+status.upper()+' samples')
              print()
              n=0
              seen=set()
              for x in entries:
                  if x['status']!=status: continue
                  title=x['name']
                  clean=re.sub(r'^.*?\b\d{1,2}:\d{2}\s+\d{1,2}/\d{1,2}\s*','',title)
                  clean=re.sub(r'\s*(?:\([^)]*\)|\[[^]]*\])\s*$','',clean)
                  key=clean.lower()
                  if key in seen: continue
                  seen.add(key)
                  print('- ['+x['group']+'] '+title+' | logo='+str(x['logo']))
                  n+=1
                  if n>=90: break
              print()
          print('## EXTINF metadata (URL intentionally not emitted)')
          print()
          for x in entries[:10]:
              m=re.sub(r'https?://[^\s"\']+', '[url]', x['meta'])
              print('- '+m)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LIVE_FEED_INSPECTION.md
          git commit -m 'test: update dedicated Live feed analysis' || exit 0
          git push origin HEAD:work/mobile-live-feed-lau-style-20261012
