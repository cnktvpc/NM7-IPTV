name: NM7 IPTV Mobile 1.10.136 — Exact Replacement Source Build

on:
  push:
    branches:
      - "build/mobile-1.10.136-exact-source-20261015"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nm7-mobile-1.10.136-exact-source
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          submodules: false

      - name: Restore byte-for-byte files from replacement ZIP
        id: source_sync
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .source-overlay/MobileInlinePlayerProviderV2.java.b64.part01 ]]; then
            app_java="app/src/main/java/vn/phuong/iptvplayer"
            cat .source-overlay/MobileInlinePlayerProviderV2.java.b64.part* | base64 --decode | gzip -dc > "$app_java/MobileInlinePlayerProviderV2.java"
            gzip -dc .source-overlay/ChannelAdapter.java.gz > "$app_java/ChannelAdapter.java"
            gzip -dc .source-overlay/MobileNm7Application.java.gz > "$app_java/MobileNm7Application.java"
            gzip -dc .source-overlay/app-build.gradle.kts.gz > app/build.gradle.kts

            test "$(git hash-object "$app_java/MobileInlinePlayerProviderV2.java")" = "22095b16eb499b087820069ddce0095f3bf5c44d"
            test "$(git hash-object "$app_java/ChannelAdapter.java")" = "80cd8aab22d363af2e943064e94cd308cddc45f5"
            test "$(git hash-object "$app_java/MobileNm7Application.java")" = "937a9a7fdb193cc9e7176609cd0e03eaac694b79"
            test "$(git hash-object app/build.gradle.kts)" = "9523dd9bd81b76916bf10bc22470c81e34ab62e2"
            test "$(git hash-object "$app_java/M3uParser.java")" = "6029e743aefbcb2b7d74c1ac727344fcd2a9933b"
            grep -F 'versionName = "1.10.136"' app/build.gradle.kts
            grep -F 'versionCode = 152' app/build.gradle.kts

            rm -rf .source-overlay
            git rm -f --ignore-unmatch "$app_java/NetworkClient.java" .github/workflows/nm7-mobile-live-events-v138.yml scripts/verify-mobile-live-feed-v138.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "build: restore exact replacement NM7 Mobile source"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore pinned SmartTube phone source
        if: steps.source_sync.outputs.synced != 'true'
        run: |
          set -euxo pipefail
          git clone --no-checkout https://github.com/systematiq-one/SmartTube-droid.git third_party/SmartTube-droid
          git -C third_party/SmartTube-droid checkout --detach 4825d6aa8b6f1d3181927f9e96c7d89cab13d510
          git -C third_party/SmartTube-droid submodule update --init --recursive

      - name: Patch only external SmartTube Gradle compatibility
        if: steps.source_sync.outputs.synced != 'true'
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('third_party/SmartTube-droid')
          for p in root.rglob('build.gradle'):
              if '.git' in p.parts: continue
              t=p.read_text(errors='ignore'); orig=t
              manifest=p.parent/'src/main/AndroidManifest.xml'; pkg=None
              if manifest.is_file():
                  m=re.search(r'\bpackage\s*=\s*["\']([^"\']+)["\']',manifest.read_text(errors='ignore'))
                  if m: pkg=m.group(1)
              if 'android {' in t:
                  if pkg and not re.search(r'\bnamespace\s',t): t=re.sub(r'(android\s*\{)',r'\1\n    namespace "'+pkg+'"',t,1)
                  if not re.search(r'compileSdkVersion|compileSdk\s*[= ]',t): t=re.sub(r'(android\s*\{)',r'\1\n    compileSdkVersion project.properties.compileSdkVersion',t,1)
                  if 'flavorDimensions' not in t: t=re.sub(r'(android\s*\{)',r'\1\n    flavorDimensions "device"',t,1)
                  elif '"device"' not in re.search(r'flavorDimensions[^\n]*',t).group(0): t=re.sub(r'(flavorDimensions\s+[^\n]+)',r'\1, "device"',t,1)
                  if not re.search(r'\bmobile\s*\{\s*dimension\s+["\']device["\']',t,re.S): t=re.sub(r'(android\s*\{)',r'\1\n    productFlavors { mobile { dimension "device" } }',t,1)
                  for f in ('stbeta','ststable','stfdroid'): t=re.sub(r'(?m)^(\s*)'+f+r'\s*\{\s*\}',lambda m:m.group(1)+f+' { dimension "default" }',t)
                  t=re.sub(r'(?m)^(\s*)classifier\s+["\']([^"\']+)["\']\s*$',r"\1archiveClassifier.set('\2')",t)
                  t=re.sub(r'(?m)^(\s*)classifier\s*=\s*["\']([^"\']+)["\']\s*$',r"\1archiveClassifier.set('\2')",t)
                  if 'kotlin-android' in t and 'kotlinOptions' not in t: t=re.sub(r'(android\s*\{)',r'\1\n    kotlinOptions { jvmTarget = "1.8" }',t,1)
              if t!=orig: p.write_text(t)
          PY

      - name: Apply NM7 Mobile-to-SmartTube integration patches
        if: steps.source_sync.outputs.synced != 'true'
        run: |
          set -euxo pipefail
          python3 scripts/patch-mobile-v37.py
          python3 scripts/patch-mobile-v106.py
          python3 scripts/patch-mobile-v114-youtube-ui.py
          python3 scripts/patch-mobile-v119-youtube-chrome-final.py
          python3 scripts/patch-mobile-v120-youtube-statusbar-final.py
          python3 scripts/patch-mobile-v121-native-statusbar.py
          python3 scripts/patch-mobile-v122-youtube-overdraw-final.py
          python3 scripts/patch-mobile-v123-youtube-wordmark-final.py
          python3 scripts/patch-mobile-v128-youtube-wordmark-exact.py
          python3 scripts/patch-mobile-v130-pull-refresh.py
          python3 scripts/verify-mobile-pull-refresh.py
          python3 scripts/verify-mobile-live-feed-v134.py
          python3 scripts/verify-mobile-live-fullscreen-server-v136.py

      - name: Patch legacy SmartTube resource collisions
        if: steps.source_sync.outputs.synced != 'true'
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('third_party/SmartTube-droid')
          for base in (root/'exoplayer-amzn-2.10.6/library/ui/src/main/java', root/'exoplayer-amzn-2.10.6/library/ui/src/main/res'):
              if not base.is_dir(): continue
              for p in base.rglob('*'):
                  if p.suffix not in {'.java','.xml'}: continue
                  t=p.read_text(errors='ignore'); n=t.replace('show_buffering','st_show_buffering')
                  if n!=t: p.write_text(n)
          ui=root/'exoplayer-amzn-2.10.6/library/ui'
          res=ui/'src/main/res/layout'; player=ui/'src/main/java/com/google/android/exoplayer2/ui/PlayerView.java'
          if res.is_dir() and player.is_file():
              for name in ('exo_player_view.xml','exo_simple_player_view.xml'):
                  if (res/name).is_file(): (res/('st_'+name)).write_text((res/name).read_text())
              simple=res/'st_exo_player_view.xml'
              if simple.is_file(): simple.write_text(simple.read_text().replace('@layout/exo_simple_player_view','@layout/st_exo_simple_player_view'))
              player.write_text(player.read_text().replace('R.layout.exo_player_view','R.layout.st_exo_player_view'))
          p=root/'SharedModules/sharedutils/src/main/java/com/liskovsoft/sharedutils/okhttp/DohProviders.kt'
          if p.is_file():
              t=p.read_text().replace('import okhttp3.toHttpUrlOrNull\n','').replace('return s.toHttpUrlOrNull() ?: throw NullPointerException("unable to parse url")','return HttpUrl.get(s)').replace('return HttpUrl.parse(s) ?: throw NullPointerException("unable to parse url")','return HttpUrl.get(s)')
              p.write_text(t)
          p=root/'smarttubedroid/src/main/java/com/liskovsoft/smartyoutubetv2/droid/ui/playback/PlaybackActivity.java'
          if p.is_file():
              lines=p.read_text().splitlines(True)
              for i,line in enumerate(lines):
                  if ('public float getPitch(' in line or 'public void setPitch(' in line) and i>0 and lines[i-1].strip()=='@Override': lines[i-1]=''
              p.write_text(''.join(lines))
          p=root/'MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/service/data/YouTubeMediaItem.java'
          if p.is_file():
              lines=p.read_text().splitlines(True)
              for i in range(1,len(lines)):
                  if lines[i].strip().startswith('public String getChannelThumbnailUrl(') and lines[i-1].strip()=='@Override': lines[i-1]=''
              p.write_text(''.join(lines))
          PY

      - name: Configure Java
        if: steps.source_sync.outputs.synced != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle
        if: steps.source_sync.outputs.synced != 'true'
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.13"

      - name: Configure Android SDK
        if: steps.source_sync.outputs.synced != 'true'
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          packages: "platform-tools"

      - name: Install Android SDK packages
        if: steps.source_sync.outputs.synced != 'true'
        run: sdkmanager "platforms;android-34" "platforms;android-36" "build-tools;36.0.0"

      - name: Confirm source version and compile unchanged app
        if: steps.source_sync.outputs.synced != 'true'
        run: |
          set -euxo pipefail
          grep -F 'versionName = "1.10.136"' app/build.gradle.kts
          grep -F 'versionCode = 152' app/build.gradle.kts
          ! grep -R 'NetworkClient' app/src/main/java
          gradle --no-daemon --console=plain \
            -PcompileSdkVersion=android-36 -PminSdkVersion=23 -PtargetSdkVersion=36 \
            -PbuildToolsVersion=36.0.0 -PjunitXVersion=1.1.5 -PtruthXVersion=1.5.0 \
            -PtestXSupportVersion=1.1.0 -PannotationXVersion=1.1.0 \
            :app:assembleMobileDebug :app:testMobileDebugUnitTest

      - name: Package APK and SHA-256
        if: steps.source_sync.outputs.synced != 'true'
        run: |
          set -euxo pipefail
          mkdir -p dist/mobile
          cp app/build/outputs/apk/mobile/debug/*.apk dist/mobile/
          cd dist/mobile && sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK artifact
        if: steps.source_sync.outputs.synced != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NM7-IPTV-Mobile-1.10.136-REPLACEMENT-SOURCE
          path: dist/mobile/
          retention-days: 30
          if-no-files-found: error
