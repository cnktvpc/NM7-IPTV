name: Update NM7 private playlist

on:
  push:
    paths:
      - '.github/workflows/update-nm7-playlist.yml'
  schedule:
    - cron: '0-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-playlist:
    # Pin the hosted runner image instead of ubuntu-latest so an image alias
    # change cannot break the scheduled updater unexpectedly.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch current public match schedule
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nm7
          curl -L --fail --max-time 60 --retry 3 --retry-delay 3 \
            -A 'Mozilla/5.0' -H 'Cache-Control: no-cache' \
            'https://chuoichientv.link/lich-thi-dau/' \
            -o /tmp/nm7/chuoichien.html
          test -s /tmp/nm7/chuoichien.html

      - name: Rebuild dynamic matches without destroying canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          from html import unescape

          packed=''.join(Path(f'playlist/nm7-private.part{i}.b64').read_text(encoding='utf-8').strip() for i in range(1,5))
          source=gzip.decompress(base64.b64decode(packed)).decode('utf-8','ignore').replace('\\r','')
          blocks=re.split(r'(?=#EXTINF:)',source)

          existing=[]
          existing_keys=set()
          for block in blocks:
              if not block.startswith('#EXTINF:'):
                  continue
              lines=[x.strip() for x in block.splitlines() if x.strip()]
              if not lines or any(x.startswith('#NM7-DYNAMIC:ChuoiChien') for x in lines):
                  continue
              urls=[x for x in lines if re.match(r'^https?://',x,re.I)]
              if not urls:
                  continue
              url=urls[-1].rstrip('.,)')
              header=lines[0]
              extra='\\n'.join(lines[1:-1])
              entry=header + (('\\n'+extra) if extra else '') + '\\n' + url
              key=header+'\\n'+extra+'\\n'+url
              if key not in existing_keys:
                  existing_keys.add(key)
                  existing.append(entry)

          channels={
            'Chuối Lá':'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoilahd/playlist.m3u8',
            'Chuối Nhỏ':'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoinhohd/playlist.m3u8',
            'Chuối To':'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoitohd/playlist.m3u8',
            'Chuối Chao':'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoichaohd/playlist.m3u8',
            'Chuối Kem':'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoikemhd/playlist.m3u8',
            'Chuối Tây':'https://stm9ee346727718.stream.hdplaylink.com/cctvlive/chuoitayhd/playlist.m3u8',
          }
          referrer='https://live.chuoichien.tv/'
          html=Path('/tmp/nm7/chuoichien.html').read_text(encoding='utf-8',errors='ignore')

          generated=[]
          # The current page uses h3/h4 date headings. Parse each date section
          # independently and accept either HTML tables or normalized text.
          section_re=re.compile(r'<h[34][^>]*>(.*?)</h[34]>(.*?)(?=<h[1-6][^>]*>|\\Z)',re.I|re.S)
          sections=section_re.findall(html)
          for heading, section in sections:
              htext=re.sub(r'<[^>]+>',' ',heading)
              htext=re.sub(r'\\s+',' ',unescape(htext)).strip()
              dm=re.search(r'(\\d{1,2})/(\\d{1,2})/(\\d{4})',htext)
              if not dm:
                  continue
              date_label=f'{int(dm.group(1)):02d}/{int(dm.group(2)):02d}'
              rows=re.findall(r'<tr[^>]*>(.*?)</tr>',section,re.I|re.S)
              for row in rows:
                  cells=re.findall(r'<t[dh][^>]*>(.*?)</t[dh]>',row,re.I|re.S)
                  cells=[re.sub(r'<[^>]+>',' ',c) for c in cells]
                  cells=[re.sub(r'\\s+',' ',unescape(c)).strip() for c in cells]
                  if len(cells)<2:
                      continue
                  tm=next((re.search(r'\\b\\d{1,2}:\\d{2}\\b',c) for c in cells),None)
                  match=next((c for c in cells if re.search(r'\\bvs\\b',c,re.I)),None)
                  channel=next((k for k in channels if re.search(re.escape(k), ' '.join(cells), re.I)),None)
                  if not tm or not match or not channel:
                      continue
                  generated.append('\\n'.join([
                    '#NM7-DYNAMIC:ChuoiChien',
                    f'#EXTINF:-1 group-title="Chuối Chiên TV", {tm.group(0)} {date_label} ⚽ {match} ({channel}) [FHD] [hls]',
                    f'#EXTVLCOPT:http-referrer={referrer}',
                    channels[channel],
                  ]))

          # Text fallback for changed markup: extract date blocks and rows from
          # the rendered text while requiring an explicit mapped Chuối BLV.
          if not generated:
              text=re.sub(r'<script.*?</script>|<style.*?</style>',' ',html,flags=re.I|re.S)
              text=re.sub(r'<[^>]+>','\\n',text)
              text=re.sub(r'\\s+',' ',unescape(text))
              date_matches=list(re.finditer(r'(?:Hôm nay|Ngày mai|Ngay hom nay|Ngay mai)[^0-9]*(\\d{1,2})/(\\d{1,2})/(\\d{4})',text,re.I))
              for di,dm in enumerate(date_matches):
                  date_label=f'{int(dm.group(1)):02d}/{int(dm.group(2)):02d}'
                  end=date_matches[di+1].start() if di+1<len(date_matches) else len(text)
                  section=text[dm.end():end]
                  pat=re.compile(r'(\\d{1,2}:\\d{2})\\s+(.{3,160}?\\bvs\\b.{3,160}?)(?=\\s+(?:Chuối\\s+(?:Lá|Nhỏ|To|Chao|Kem|Tây))\\b)',re.I)
                  for m in pat.finditer(section):
                      tail=section[m.end():m.end()+80]
                      channel=next((k for k in channels if re.search(re.escape(k),tail,re.I)),None)
                      if channel:
                          generated.append('\\n'.join([
                            '#NM7-DYNAMIC:ChuoiChien',
                            f'#EXTINF:-1 group-title="Chuối Chiên TV", {m.group(1)} {date_label} ⚽ {m.group(2).strip()} ({channel}) [FHD] [hls]',
                            f'#EXTVLCOPT:http-referrer={referrer}',
                            channels[channel],
                          ]))

          if not generated:
              raise SystemExit('Schedule scrape produced 0 mapped matches; refusing to overwrite playlist')

          seen=set()
          fresh=[]
          for entry in generated:
              if entry not in seen:
                  seen.add(entry)
                  fresh.append(entry)

          all_entries=existing+fresh
          out='#EXTM3U\\n'+'\\n'.join(all_entries)+'\\n'
          Path('/tmp/nm7/latest.m3u').write_text(out,encoding='utf-8')
          print('preserved canonical entries:',len(existing))
          print('fresh dynamic matches:',len(fresh))
          print('final entries:',len(all_entries))
          PY

      - name: Pack playlist into four fixed chunks
        shell: bash
        run: |
          set -euo pipefail
          gzip -9 -c /tmp/nm7/latest.m3u | base64 -w0 > /tmp/nm7/latest.b64
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/nm7/latest.b64').read_text().strip()
          n=4
          size=(len(s)+n-1)//n
          for i in range(n):
              Path(f'playlist/nm7-private.part{i+1}.b64').write_text(s[i*size:(i+1)*size],encoding='utf-8')
          print('base64 chars:',len(s))
          PY

      - name: Validate packed playlist before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          s=''.join(Path(f'playlist/nm7-private.part{i}.b64').read_text().strip() for i in range(1,5))
          text=gzip.decompress(base64.b64decode(s)).decode('utf-8')
          assert text.startswith('#EXTM3U')
          entries=[x for x in text.splitlines() if x.startswith('#EXTINF:')]
          playable=[x for x in text.splitlines() if re.match(r'^https?://',x)]
          groups=re.findall(r'group-title="([^"]+)"',text,re.I)
          required={'Vua Sân Cỏ TV','Socolive TV','Cola TV','Xôi Lạc Z TV','Khán Đài TV','Gà Vàng 33 TV','S8 TV','Giờ Vàng TV','Bia Ôm TV','Gà Vàng TV','Sao Kê TV','Chuối Chiên TV'}
          actual=set(groups)
          missing=required-actual
          print('validation EXTINF:',len(entries))
          print('validation playable:',len(playable))
          print('validation groups:',len(actual))
          if missing:
              raise SystemExit('REFUSING COMMIT: missing required groups: '+', '.join(sorted(missing)))
          if len(entries) < 424 or len(playable) < 424:
              raise SystemExit(f'REFUSING COMMIT: playlist shrank below protected canonical baseline (EXTINF={len(entries)}, playable={len(playable)}, minimum=424)')
          print('validation OK: all 12 groups present and canonical inventory size maintained')
          PY

      - name: Commit only when playlist changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlist/nm7-private.part*.b64
          if git diff --cached --quiet; then
            echo 'Playlist unchanged.'
            exit 0
          fi
          git commit -m 'auto: update NM7 playlist from current match schedule'
          git push
